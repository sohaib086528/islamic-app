version: '3.9'

services:
  islamic-app-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: islamic-app-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    env_file:
      - ../backend/.env.production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - islamic-app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  islamic-app-network:
    driver: bridge
