version: '3.9'

services:
  islamic-app-api:
    build: ../backend
    container_name: islamic-app-api
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - QURAN_API_BASE=https://api.alquran.cloud/v1
      - ALADHAN_API_BASE=https://api.aladhan.com/v1
      - ALLOWED_ORIGINS=https://yourdomain.com
    networks:
      - islamic-app-network

networks:
  islamic-app-network:
    external: false
